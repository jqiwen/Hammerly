groups:
  - name: hammerly.availability
    rules:
      - alert: HammerlyServiceDown
        expr: up{job=~"hammerly-(backend|ai|worker)"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Hammerly service is unavailable"
          description: "Prometheus has been unable to scrape {{ $labels.job }} for 2 minutes."

  - name: hammerly.ai
    rules:
      - alert: HammerlyAiHighErrorRate
        expr: |
          (
            sum(rate(ai_request_duration_seconds_count{job="hammerly-ai",outcome!="success"}[5m]))
            /
            clamp_min(sum(rate(ai_request_duration_seconds_count{job="hammerly-ai"}[5m])), 0.001)
          ) > 0.05
          and
          sum(increase(ai_request_duration_seconds_count{job="hammerly-ai"}[5m])) >= 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "AI request error rate is high"
          description: "More than 5% of AI requests have failed or been cancelled for 5 minutes."

      - alert: HammerlyAiHighLatency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(ai_request_duration_seconds_bucket{job="hammerly-ai"}[5m]))
          ) > 5
          and
          sum(increase(ai_request_duration_seconds_count{job="hammerly-ai"}[5m])) >= 20
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "AI request p95 latency is high"
          description: "AI end-to-end p95 latency has exceeded 5 seconds for 10 minutes."

      - alert: HammerlyAiHighFirstTokenLatency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(hammerly_ai_provider_first_token_latency_seconds_bucket{job="hammerly-ai"}[5m])
            )
          ) > 3
          and
          sum(increase(hammerly_ai_provider_first_token_latency_seconds_count{job="hammerly-ai"}[5m])) >= 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "AI first-token latency is high"
          description: "Provider first-token p95 latency has exceeded 3 seconds for 10 minutes."

  - name: hammerly.events
    rules:
      - alert: HammerlyKafkaPublishFailures
        expr: sum(increase(hammerly_kafka_publish_failure_total{job="hammerly-ai"}[10m])) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "AI events are failing to publish"
          description: "At least one AI event failed to publish to Kafka in the last 10 minutes."

      - alert: HammerlyWorkerFailures
        expr: sum(increase(hammerly_worker_event_failed_total{job="hammerly-worker"}[10m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Worker event processing is failing"
          description: "More than two worker event attempts failed in the last 10 minutes."

      - alert: HammerlyWorkerDeadLetterEvents
        expr: sum(increase(hammerly_worker_event_dlt_total{job="hammerly-worker"}[15m])) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Worker events reached a dead-letter topic"
          description: "At least one exhausted worker event was sent to a DLT in the last 15 minutes."

  - name: hammerly.dependencies
    rules:
      - alert: HammerlyRedisDegraded
        expr: |
          sum(increase({
            job=~"hammerly-(backend|ai)",
            __name__=~"hammerly_ai_redis_error_total|hammerly_ai_redis_short_circuit_total|marketplace_cache_errors_total|auth_rate_limit_redis_fallback_total"
          }[10m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis-backed features are degraded"
          description: "More than two Redis errors, fallbacks, or short circuits occurred in the last 10 minutes."

      - alert: HammerlyAiCircuitBreakerOpen
        expr: max(resilience4j_circuitbreaker_state{job="hammerly-ai",state="open"}) == 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "AI provider circuit breaker is open"
          description: "The AI provider circuit breaker has remained open for 2 minutes."

      - alert: HammerlyAiCircuitBreakerRejections
        expr: sum(increase(hammerly_ai_circuit_open_rejected_total{job="hammerly-ai"}[5m])) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "AI requests are rejected by the open circuit"
          description: "At least one AI provider call was rejected by an open circuit in the last 5 minutes."
