name: Phase 5 load test

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: Non-production backend URL running the loadtest provider
        required: true
        type: string
      mode:
        description: Load-test schedule
        required: true
        default: smoke
        type: choice
        options: [smoke, full]
      confirm_loadtest_provider:
        description: Confirm target uses SPRING_PROFILES_ACTIVE=loadtest
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  phase5:
    if: inputs.confirm_loadtest_provider == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build pinned k6 SSE image
        run: docker build -f load-test/phase5/Dockerfile.k6 -t hammerly-k6-sse:1.2.2 .
      - name: Run explicitly selected SSE test
        env:
          HAMMERLY_LOAD_TEST_BASE_URL: ${{ inputs.target_url }}
          HAMMERLY_LOAD_TEST_MODE: ${{ inputs.mode }}
          HAMMERLY_LOAD_TEST_TOKEN: ${{ secrets.HAMMERLY_LOAD_TEST_TOKEN }}
          PROVIDER_MODE: loadtest
          PHASE5_SUMMARY_EXPORT: phase5-summary.json
        run: >-
          docker run --rm
          -e HAMMERLY_LOAD_TEST_BASE_URL
          -e HAMMERLY_LOAD_TEST_MODE
          -e HAMMERLY_LOAD_TEST_TOKEN
          -e PROVIDER_MODE
          -e PHASE5_SUMMARY_EXPORT=/workspace/phase5-summary.json
          -v "${PWD}:/workspace"
          hammerly-k6-sse:1.2.2
          run /workspace/load-test/phase5/chat-sse.js
      - name: Upload benchmark summary
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: phase5-${{ inputs.mode }}-summary
          path: phase5-summary.json
          if-no-files-found: warn
