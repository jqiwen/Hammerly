name: Deploy AI

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: deploy-hammerly-ai
  cancel-in-progress: true

jobs:
  configuration:
    name: AI deployment configuration
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.guard.outputs.enabled }}
    steps:
      - name: Check deployment configuration
        id: guard
        shell: bash
        env:
          DEPLOYMENTS_ENABLED: ${{ vars.GCP_DEPLOYMENTS_ENABLED }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          GCP_ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
          AI_CLOUD_RUN_SERVICE: ${{ vars.AI_CLOUD_RUN_SERVICE }}
          AI_RUNTIME_SERVICE_ACCOUNT: ${{ vars.AI_RUNTIME_SERVICE_ACCOUNT }}
          AI_OPENAI_SECRET: ${{ vars.AI_OPENAI_SECRET }}
          AI_REDIS_PASSWORD_SECRET: ${{ vars.AI_REDIS_PASSWORD_SECRET }}
          AI_INTERNAL_TOKEN_SECRET: ${{ vars.AI_INTERNAL_TOKEN_SECRET }}
          # AI and Core use the same Supabase database. Keep the AI-specific
          # override, but remain compatible with the original Core variable.
          AI_DB_SECRET: ${{ vars.AI_DB_SECRET || vars.CORE_DB_SECRET }}
          AI_REDIS_HOST: ${{ vars.AI_REDIS_HOST }}
          AI_REDIS_PORT: ${{ vars.AI_REDIS_PORT }}
          AI_REDIS_SSL: ${{ vars.AI_REDIS_SSL }}
          HAMMERLY_REDIS_ENABLED: ${{ vars.HAMMERLY_REDIS_ENABLED }}
          AI_VPC_NETWORK: ${{ vars.AI_VPC_NETWORK }}
          AI_VPC_SUBNET: ${{ vars.AI_VPC_SUBNET }}
        run: |
          set -euo pipefail
          if [[ "${DEPLOYMENTS_ENABLED}" != "true" ]]; then
            echo "::notice::AI deployment is prepared but disabled. Set GCP_DEPLOYMENTS_ENABLED=true after completing the documented GCP and Redis setup."
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          missing=0
          for variable_name in \
            GCP_PROJECT_ID GCP_REGION GCP_WORKLOAD_IDENTITY_PROVIDER \
            GCP_DEPLOY_SERVICE_ACCOUNT GCP_ARTIFACT_REPOSITORY \
            AI_CLOUD_RUN_SERVICE AI_RUNTIME_SERVICE_ACCOUNT \
            AI_OPENAI_SECRET AI_REDIS_PASSWORD_SECRET AI_INTERNAL_TOKEN_SECRET AI_DB_SECRET \
            AI_REDIS_HOST AI_REDIS_PORT AI_REDIS_SSL HAMMERLY_REDIS_ENABLED \
            AI_VPC_NETWORK AI_VPC_SUBNET; do
            if [[ -z "${!variable_name:-}" ]]; then
              echo "::error::Missing required GitHub variable: ${variable_name}"
              missing=1
            fi
          done
          if [[ "${AI_REDIS_SSL}" != "true" || "${HAMMERLY_REDIS_ENABLED}" != "true" ]]; then
            echo "::error::Production AI requires Upstash Redis over TLS (AI_REDIS_SSL=true and HAMMERLY_REDIS_ENABLED=true)."
            missing=1
          fi
          [[ "${missing}" == "0" ]]
          echo "enabled=true" >> "${GITHUB_OUTPUT}"

  deploy:
    name: AI CD
    needs: configuration
    if: needs.configuration.outputs.enabled == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_deploy-cloud-run.yml
    with:
      service-directory: hammerly-ai
      image-name: hammerly-ai
      cloud-run-service: ${{ vars.AI_CLOUD_RUN_SERVICE }}
      project-id: ${{ vars.GCP_PROJECT_ID }}
      region: ${{ vars.GCP_REGION }}
      artifact-repository: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
      workload-identity-provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      deployment-service-account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      runtime-service-account: ${{ vars.AI_RUNTIME_SERVICE_ACCOUNT }}
      port: 5001
      health-path: /actuator/health
      deploy-flags: >-
        --allow-unauthenticated
        --memory=1Gi
        --cpu=1
        --cpu-boost
        --min-instances=${{ vars.AI_CLOUD_RUN_MIN_INSTANCES || '0' }}
        --max-instances=5
        --network=${{ vars.AI_VPC_NETWORK }}
        --subnet=${{ vars.AI_VPC_SUBNET }}
        --vpc-egress=private-ranges-only
      environment-variables: |-
        SPRING_PROFILES_ACTIVE=prod
        OPENAI_MODEL=${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
        OPENAI_MAX_OUTPUT_TOKENS=${{ vars.OPENAI_MAX_OUTPUT_TOKENS || '200' }}
        HAMMERLY_AI_LLM_MAX_ATTEMPTS=${{ vars.HAMMERLY_AI_LLM_MAX_ATTEMPTS || '2' }}
        HAMMERLY_AI_LLM_FIRST_TOKEN_TIMEOUT=${{ vars.HAMMERLY_AI_LLM_FIRST_TOKEN_TIMEOUT || '8s' }}
        HAMMERLY_AI_LLM_IDLE_TIMEOUT=${{ vars.HAMMERLY_AI_LLM_IDLE_TIMEOUT || '10s' }}
        REDIS_HOST=${{ vars.AI_REDIS_HOST }}
        REDIS_PORT=${{ vars.AI_REDIS_PORT }}
        REDIS_SSL=${{ vars.AI_REDIS_SSL }}
        HAMMERLY_REDIS_ENABLED=${{ vars.HAMMERLY_REDIS_ENABLED }}
        HAMMERLY_KAFKA_ENABLED=${{ vars.HAMMERLY_KAFKA_ENABLED || 'false' }}
        HAMMERLY_RAG_ENABLED=${{ vars.HAMMERLY_RAG_ENABLED || 'true' }}
        HAMMERLY_RAG_TOP_K=${{ vars.HAMMERLY_RAG_TOP_K || '3' }}
        HAMMERLY_RAG_SIMILARITY_THRESHOLD=${{ vars.HAMMERLY_RAG_SIMILARITY_THRESHOLD || '0.25' }}
        HAMMERLY_RAG_TIMEOUT=${{ vars.HAMMERLY_RAG_TIMEOUT || '1200ms' }}
        HAMMERLY_RAG_KB_VERSION_CACHE_TTL=${{ vars.HAMMERLY_RAG_KB_VERSION_CACHE_TTL || '45s' }}
        HAMMERLY_AI_CONTEXT_RECENT_TURNS=${{ vars.HAMMERLY_AI_CONTEXT_RECENT_TURNS || '3' }}
        HAMMERLY_AI_CONTEXT_MAX_CHARS=${{ vars.HAMMERLY_AI_CONTEXT_MAX_CHARS || '8000' }}
        HAMMERLY_AI_EMBEDDING_PROVIDER=${{ vars.HAMMERLY_AI_EMBEDDING_PROVIDER || 'openai' }}
        HAMMERLY_AI_EMBEDDING_MODEL=${{ vars.HAMMERLY_AI_EMBEDDING_MODEL || 'text-embedding-3-small' }}
        KAFKA_BOOTSTRAP_SERVERS=${{ vars.KAFKA_BOOTSTRAP_SERVERS || 'kafka-not-configured.invalid:9092' }}
        HAMMERLY_COMMIT_SHA=${{ github.sha }}
      secret-bindings: |-
        OPENAI_API_KEY=${{ vars.AI_OPENAI_SECRET }}:latest
        SUPABASE_DB_URL=${{ vars.AI_DB_SECRET || vars.CORE_DB_SECRET }}:latest
        REDIS_PASSWORD=${{ vars.AI_REDIS_PASSWORD_SECRET }}:latest
        HAMMERLY_AI_INTERNAL_TOKEN=${{ vars.AI_INTERNAL_TOKEN_SECRET }}:latest
