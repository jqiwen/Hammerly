name: Deploy Core

on:
  push:
    branches: [main]
    paths:
      - "hammerly-backend/**"
      - ".github/workflows/deploy-core.yml"
      - ".github/workflows/_deploy-cloud-run.yml"
  workflow_dispatch:

concurrency:
  group: deploy-hammerly-core
  cancel-in-progress: true

jobs:
  configuration:
    name: Core deployment configuration
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.guard.outputs.enabled }}
    steps:
      - name: Check deployment configuration
        id: guard
        shell: bash
        env:
          DEPLOYMENTS_ENABLED: ${{ vars.GCP_DEPLOYMENTS_ENABLED }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          GCP_ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
          CORE_CLOUD_RUN_SERVICE: ${{ vars.CORE_CLOUD_RUN_SERVICE }}
          CORE_RUNTIME_SERVICE_ACCOUNT: ${{ vars.CORE_RUNTIME_SERVICE_ACCOUNT }}
          CORE_DB_SECRET: ${{ vars.CORE_DB_SECRET }}
          CORE_JWT_SECRET: ${{ vars.CORE_JWT_SECRET }}
          # Core and AI use the same Redis deployment. Keep the Core-specific
          # override, but remain compatible with the original AI variable.
          CORE_REDIS_PASSWORD_SECRET: ${{ vars.CORE_REDIS_PASSWORD_SECRET || vars.AI_REDIS_PASSWORD_SECRET }}
          AI_INTERNAL_TOKEN_SECRET: ${{ vars.AI_INTERNAL_TOKEN_SECRET }}
          AI_VPC_NETWORK: ${{ vars.AI_VPC_NETWORK }}
          AI_VPC_SUBNET: ${{ vars.AI_VPC_SUBNET }}
          HAMMERLY_FRONTEND_URL: ${{ vars.HAMMERLY_FRONTEND_URL }}
          HAMMERLY_AI_URL: ${{ vars.HAMMERLY_AI_URL }}
        run: |
          set -euo pipefail
          if [[ "${DEPLOYMENTS_ENABLED}" != "true" ]]; then
            echo "::notice::Core deployment is prepared but disabled. Set GCP_DEPLOYMENTS_ENABLED=true after completing the documented GCP setup."
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          missing=0
          for variable_name in \
            GCP_PROJECT_ID GCP_REGION GCP_WORKLOAD_IDENTITY_PROVIDER \
            GCP_DEPLOY_SERVICE_ACCOUNT GCP_ARTIFACT_REPOSITORY \
            CORE_CLOUD_RUN_SERVICE CORE_RUNTIME_SERVICE_ACCOUNT \
            CORE_DB_SECRET CORE_JWT_SECRET CORE_REDIS_PASSWORD_SECRET AI_INTERNAL_TOKEN_SECRET \
            AI_VPC_NETWORK AI_VPC_SUBNET \
            HAMMERLY_FRONTEND_URL HAMMERLY_AI_URL; do
            if [[ -z "${!variable_name:-}" ]]; then
              echo "::error::Missing required GitHub variable: ${variable_name}"
              missing=1
            fi
          done
          [[ "${missing}" == "0" ]]
          echo "enabled=true" >> "${GITHUB_OUTPUT}"

  deploy:
    name: Core CD
    needs: configuration
    if: needs.configuration.outputs.enabled == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_deploy-cloud-run.yml
    with:
      service-directory: hammerly-backend
      image-name: hammerly-core
      cloud-run-service: ${{ vars.CORE_CLOUD_RUN_SERVICE }}
      project-id: ${{ vars.GCP_PROJECT_ID }}
      region: ${{ vars.GCP_REGION }}
      artifact-repository: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
      workload-identity-provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      deployment-service-account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      runtime-service-account: ${{ vars.CORE_RUNTIME_SERVICE_ACCOUNT }}
      port: 5000
      health-path: /health
      deploy-flags: >-
        --allow-unauthenticated
        --memory=1Gi
        --cpu=1
        --cpu-boost
        --min-instances=${{ vars.CORE_CLOUD_RUN_MIN_INSTANCES || '0' }}
        --max-instances=5
        --network=${{ vars.AI_VPC_NETWORK }}
        --subnet=${{ vars.AI_VPC_SUBNET }}
        --vpc-egress=private-ranges-only
      environment-variables: |-
        SPRING_PROFILES_ACTIVE=prod
        FRONTEND_URL=${{ vars.HAMMERLY_FRONTEND_URL }}
        HAMMERLY_AI_URL=${{ vars.HAMMERLY_AI_URL }}
        HAMMERLY_SEED_ENABLED=false
        HAMMERLY_DEBUG_ENDPOINT_ENABLED=false
        HAMMERLY_AI_DIAGNOSTIC_ENABLED=false
        HAMMERLY_MARKETPLACE_CACHE_ENABLED=${{ vars.HAMMERLY_MARKETPLACE_CACHE_ENABLED || 'false' }}
        HAMMERLY_DB_MAX_POOL_SIZE=${{ vars.HAMMERLY_DB_MAX_POOL_SIZE || '5' }}
        HAMMERLY_DB_MIN_IDLE=${{ vars.HAMMERLY_DB_MIN_IDLE || '0' }}
        HAMMERLY_KAFKA_ENABLED=${{ vars.HAMMERLY_KAFKA_ENABLED || 'false' }}
        REDIS_HOST=${{ vars.AI_REDIS_HOST || 'redis-not-configured.invalid' }}
        REDIS_PORT=${{ vars.AI_REDIS_PORT || '6379' }}
        REDIS_SSL=${{ vars.AI_REDIS_SSL || 'true' }}
        KAFKA_BOOTSTRAP_SERVERS=${{ vars.KAFKA_BOOTSTRAP_SERVERS || 'kafka-not-configured.invalid:9092' }}
        HAMMERLY_COMMIT_SHA=${{ github.sha }}
      secret-bindings: |-
        SUPABASE_DB_URL=${{ vars.CORE_DB_SECRET }}:latest
        JWT_SECRET=${{ vars.CORE_JWT_SECRET }}:latest
        REDIS_PASSWORD=${{ vars.CORE_REDIS_PASSWORD_SECRET || vars.AI_REDIS_PASSWORD_SECRET }}:latest
        HAMMERLY_AI_INTERNAL_TOKEN=${{ vars.AI_INTERNAL_TOKEN_SECRET }}:latest
