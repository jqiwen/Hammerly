name: Deploy Core

on:
  push:
    branches: [main]
    paths:
      - "hammerly-backend/**"
      - ".github/workflows/deploy-core.yml"
      - ".github/workflows/_deploy-cloud-run.yml"
  workflow_dispatch:

concurrency:
  group: deploy-hammerly-core
  cancel-in-progress: true

jobs:
  configuration:
    name: Core deployment configuration
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.guard.outputs.enabled }}
    steps:
      - name: Check deployment configuration
        id: guard
        shell: bash
        env:
          DEPLOYMENTS_ENABLED: ${{ vars.GCP_DEPLOYMENTS_ENABLED }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          GCP_ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
          CORE_CLOUD_RUN_SERVICE: ${{ vars.CORE_CLOUD_RUN_SERVICE }}
          CORE_RUNTIME_SERVICE_ACCOUNT: ${{ vars.CORE_RUNTIME_SERVICE_ACCOUNT }}
          CORE_DB_SECRET: ${{ vars.CORE_DB_SECRET }}
          CORE_JWT_SECRET: ${{ vars.CORE_JWT_SECRET }}
          AI_INTERNAL_TOKEN_SECRET: ${{ vars.AI_INTERNAL_TOKEN_SECRET }}
          HAMMERLY_FRONTEND_URL: ${{ vars.HAMMERLY_FRONTEND_URL }}
          HAMMERLY_AI_URL: ${{ vars.HAMMERLY_AI_URL }}
        run: |
          set -euo pipefail
          if [[ "${DEPLOYMENTS_ENABLED}" != "true" ]]; then
            echo "::notice::Core deployment is prepared but disabled. Set GCP_DEPLOYMENTS_ENABLED=true after completing the documented GCP setup."
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          missing=0
          for variable_name in \
            GCP_PROJECT_ID GCP_REGION GCP_WORKLOAD_IDENTITY_PROVIDER \
            GCP_DEPLOY_SERVICE_ACCOUNT GCP_ARTIFACT_REPOSITORY \
            CORE_CLOUD_RUN_SERVICE CORE_RUNTIME_SERVICE_ACCOUNT \
            CORE_DB_SECRET CORE_JWT_SECRET AI_INTERNAL_TOKEN_SECRET \
            HAMMERLY_FRONTEND_URL HAMMERLY_AI_URL; do
            if [[ -z "${!variable_name:-}" ]]; then
              echo "::error::Missing required GitHub variable: ${variable_name}"
              missing=1
            fi
          done
          [[ "${missing}" == "0" ]]
          echo "enabled=true" >> "${GITHUB_OUTPUT}"

  deploy:
    name: Core CD
    needs: configuration
    if: needs.configuration.outputs.enabled == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_deploy-cloud-run.yml
    with:
      service-directory: hammerly-backend
      image-name: hammerly-core
      cloud-run-service: ${{ vars.CORE_CLOUD_RUN_SERVICE }}
      project-id: ${{ vars.GCP_PROJECT_ID }}
      region: ${{ vars.GCP_REGION }}
      artifact-repository: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
      workload-identity-provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      deployment-service-account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      runtime-service-account: ${{ vars.CORE_RUNTIME_SERVICE_ACCOUNT }}
      port: 5000
      health-path: /health
      deploy-flags: --allow-unauthenticated --memory=1Gi --cpu=1 --min-instances=0 --max-instances=5
      environment-variables: |-
        SPRING_PROFILES_ACTIVE=prod
        FRONTEND_URL=${{ vars.HAMMERLY_FRONTEND_URL }}
        HAMMERLY_AI_URL=${{ vars.HAMMERLY_AI_URL }}
        HAMMERLY_SEED_ENABLED=false
        HAMMERLY_DEBUG_ENDPOINT_ENABLED=false
        HAMMERLY_AI_DIAGNOSTIC_ENABLED=false
        HAMMERLY_COMMIT_SHA=${{ github.sha }}
      secret-bindings: |-
        SUPABASE_DB_URL=${{ vars.CORE_DB_SECRET }}:latest
        JWT_SECRET=${{ vars.CORE_JWT_SECRET }}:latest
        HAMMERLY_AI_INTERNAL_TOKEN=${{ vars.AI_INTERNAL_TOKEN_SECRET }}:latest
