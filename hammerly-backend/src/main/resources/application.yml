server:
  port: ${PORT:5000}
  tomcat:
    max-http-form-post-size: 20MB

spring:
  application:
    name: hammerly-core
  datasource:
    url: ${SUPABASE_DB_URL}
    driver-class-name: org.postgresql.Driver
    hikari:
      schema: hammerly
      maximum-pool-size: ${HAMMERLY_DB_MAX_POOL_SIZE:5}
      minimum-idle: ${HAMMERLY_DB_MIN_IDLE:0}
      data-source-properties:
        sslmode: require
  flyway:
    enabled: true
    create-schemas: true
    default-schema: hammerly
    schemas: hammerly
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  sql:
    init:
      mode: never

hammerly:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  ai:
    base-url: ${HAMMERLY_AI_URL:http://localhost:5001}
    connect-timeout: 2s
    read-timeout: 3s
    diagnostic-enabled: ${HAMMERLY_AI_DIAGNOSTIC_ENABLED:true}
  database:
    seed: ${HAMMERLY_SEED_ENABLED:true}
  debug-endpoint:
    enabled: ${HAMMERLY_DEBUG_ENDPOINT_ENABLED:true}

jwt:
  secret: ${JWT_SECRET:your-secret-key-change-in-production}
  expiration-ms: ${JWT_EXPIRATION_MS:604800000}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /api-docs
    operations-sorter: method
