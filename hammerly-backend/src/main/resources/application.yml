server:
  port: ${PORT:5000}
  tomcat:
    max-http-form-post-size: 20MB
    max-connections: ${HAMMERLY_HTTP_MAX_CONNECTIONS:2000}
    accept-count: ${HAMMERLY_HTTP_ACCEPT_COUNT:1000}

spring:
  application:
    name: hammerly-core
  threads:
    virtual:
      enabled: true
  config:
    import: optional:file:./secrets/application-local.yml
  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USERNAME:}
    password: ${SUPABASE_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      schema: hammerly
      maximum-pool-size: ${HAMMERLY_DB_MAX_POOL_SIZE:5}
      minimum-idle: ${HAMMERLY_DB_MIN_IDLE:0}
      data-source-properties:
        sslmode: ${HAMMERLY_DB_SSL_MODE:require}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:250ms}
      timeout: ${REDIS_COMMAND_TIMEOUT:250ms}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 1000
        request.timeout.ms: 2000
        delivery.timeout.ms: 4000
  flyway:
    enabled: true
    create-schemas: true
    default-schema: hammerly
    schemas: hammerly
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  sql:
    init:
      mode: never

hammerly:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  ai:
    base-url: ${HAMMERLY_AI_URL:http://localhost:5001}
    connect-timeout: ${HAMMERLY_AI_CONNECT_TIMEOUT:2s}
    read-timeout: ${HAMMERLY_AI_READ_TIMEOUT:25s}
    stream-timeout: ${HAMMERLY_AI_STREAM_TIMEOUT:30s}
    stream-max-concurrent: ${HAMMERLY_AI_STREAM_MAX_CONCURRENT:1100}
    connection-pool-max-total: ${HAMMERLY_AI_CONNECTION_POOL_MAX_TOTAL:1100}
    connection-pool-max-per-route: ${HAMMERLY_AI_CONNECTION_POOL_MAX_PER_ROUTE:1100}
    diagnostic-enabled: ${HAMMERLY_AI_DIAGNOSTIC_ENABLED:true}
    internal-token: ${HAMMERLY_AI_INTERNAL_TOKEN:}
  internal-token-required: ${HAMMERLY_INTERNAL_TOKEN_REQUIRED:false}
  marketplace-cache:
    enabled: ${HAMMERLY_MARKETPLACE_CACHE_ENABLED:true}
    auction-ttl: ${HAMMERLY_MARKETPLACE_AUCTION_CACHE_TTL:60s}
    listing-ttl: ${HAMMERLY_MARKETPLACE_LIST_CACHE_TTL:30s}
    operation-timeout: ${HAMMERLY_MARKETPLACE_CACHE_OPERATION_TIMEOUT:500ms}
  kafka:
    enabled: ${HAMMERLY_KAFKA_ENABLED:true}
    jobs-topic: ${HAMMERLY_KAFKA_AI_JOBS_TOPIC:hammerly.ai.jobs.v1}
  outbox:
    relay-delay: ${HAMMERLY_OUTBOX_RELAY_DELAY:2s}
    retry-delay: ${HAMMERLY_OUTBOX_RETRY_DELAY:5s}
    batch-size: ${HAMMERLY_OUTBOX_BATCH_SIZE:25}
    publish-timeout: ${HAMMERLY_OUTBOX_PUBLISH_TIMEOUT:4s}
  database:
    seed: ${HAMMERLY_SEED_ENABLED:true}
  debug-endpoint:
    enabled: ${HAMMERLY_DEBUG_ENDPOINT_ENABLED:true}

jwt:
  secret: ${JWT_SECRET:local-development-secret-change-me-now}
  expiration-ms: ${JWT_EXPIRATION_MS:604800000}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /api-docs
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  health:
    redis:
      enabled: false
  metrics:
    distribution:
      percentiles-histogram:
        ai.end.to.end.duration: true
        ai.core.proxy.duration: true
