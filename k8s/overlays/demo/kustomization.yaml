apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - path: backend-loadbalancer.yaml
  - target:
      version: v1
      kind: Service
      name: hammerly-backend
    patch: |-
      - op: replace
        path: /spec/ports/0/port
        value: 80

images:
  - name: us-west1-docker.pkg.dev/hammerly-506214/hammerly/hammerly-core
    newTag: GIT_SHA
  - name: us-west1-docker.pkg.dev/hammerly-506214/hammerly/hammerly-ai
    newTag: GIT_SHA
  - name: us-west1-docker.pkg.dev/hammerly-506214/hammerly/hammerly-worker
    newTag: WORKER_GIT_SHA
