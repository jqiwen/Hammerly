apiVersion: apps/v1
kind: Deployment
metadata:
  name: hammerly-worker
  namespace: hammerly
  labels:
    app.kubernetes.io/name: hammerly-worker
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hammerly-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hammerly-worker
        app.kubernetes.io/component: worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "5002"
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: us-west1-docker.pkg.dev/hammerly-506214/hammerly/hammerly-worker:GIT_SHA
          imagePullPolicy: IfNotPresent
          env:
            - name: MANAGEMENT_PORT
              value: "5002"
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hammerly-app-secrets
                  key: REDIS_PASSWORD
            - name: REDIS_SSL
              value: "false"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: HAMMERLY_WORKER_GROUP_ID
              value: hammerly-worker-v1
            - name: HAMMERLY_WORKER_CONCURRENCY
              value: "3"
            - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
              value: health,prometheus
          ports:
            - name: management
              containerPort: 5002
          startupProbe:
            httpGet:
              path: /actuator/health
              port: management
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: management
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: management
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

