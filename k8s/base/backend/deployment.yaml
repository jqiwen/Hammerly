apiVersion: apps/v1
kind: Deployment
metadata:
  name: hammerly-backend
  namespace: hammerly
  labels:
    app.kubernetes.io/name: hammerly-backend
    app.kubernetes.io/component: api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hammerly-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hammerly-backend
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "5000"
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: backend
          image: us-west1-docker.pkg.dev/hammerly-506214/hammerly/hammerly-core:GIT_SHA
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "5000"
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: SUPABASE_DB_URL
              valueFrom:
                secretKeyRef:
                  name: hammerly-app-secrets
                  key: SUPABASE_DB_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: hammerly-app-secrets
                  key: JWT_SECRET
            - name: HAMMERLY_AI_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hammerly-app-secrets
                  key: HAMMERLY_AI_INTERNAL_TOKEN
            - name: HAMMERLY_AI_URL
              value: http://hammerly-ai:5001
            - name: FRONTEND_URL
              value: https://hammerly.org
            - name: HAMMERLY_SEED_ENABLED
              value: "false"
            - name: HAMMERLY_DEBUG_ENDPOINT_ENABLED
              value: "false"
            - name: HAMMERLY_AI_DIAGNOSTIC_ENABLED
              value: "false"
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hammerly-app-secrets
                  key: REDIS_PASSWORD
            - name: REDIS_SSL
              value: "false"
            - name: HAMMERLY_MARKETPLACE_CACHE_ENABLED
              value: "true"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: HAMMERLY_KAFKA_ENABLED
              value: "true"
            - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
              value: health,prometheus
          ports:
            - name: http
              containerPort: 5000
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
