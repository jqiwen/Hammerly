apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: hammerly
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: events
spec:
  type: ClusterIP
  clusterIP: None
  # Kafka advertises this stable DNS name before the broker can become Ready.
  # Publish the StatefulSet endpoint early to avoid a readiness/DNS deadlock.
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - name: broker
      port: 9092
      targetPort: broker
    - name: controller
      port: 9093
      targetPort: controller
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: hammerly
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: events
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
        app.kubernetes.io/component: events
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 1000
      containers:
        - name: kafka
          image: apache/kafka:3.9.1
          imagePullPolicy: IfNotPresent
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_LISTENERS
              value: CONTROLLER://:9093,BROKER://:9092
            - name: KAFKA_ADVERTISED_LISTENERS
              value: BROKER://kafka.hammerly.svc.cluster.local:9092
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT,BROKER:PLAINTEXT
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: BROKER
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@kafka-0.kafka.hammerly.svc.cluster.local:9093
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_NUM_PARTITIONS
              value: "3"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
            - name: KAFKA_LOG_DIRS
              # A GCE Persistent Disk filesystem contains lost+found at its
              # root. Kafka rejects non-topic directories, so keep logs in a
              # dedicated child directory on the mounted volume.
              value: /var/lib/kafka/data/kafka
            - name: CLUSTER_ID
              value: MkU3OEVBNTcwNTJENDM2Qk
          ports:
            - name: broker
              containerPort: 9092
            - name: controller
              containerPort: 9093
          startupProbe:
            exec:
              command:
                - sh
                - -ec
                - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null
            periodSeconds: 10
            timeoutSeconds: 8
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null
            periodSeconds: 10
            timeoutSeconds: 8
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: broker
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
