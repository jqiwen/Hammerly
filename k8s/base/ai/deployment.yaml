apiVersion: apps/v1
kind: Deployment
metadata:
  name: hammerly-ai
  namespace: hammerly
  labels:
    app.kubernetes.io/name: hammerly-ai
    app.kubernetes.io/component: ai
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: hammerly-ai
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hammerly-ai
        app.kubernetes.io/component: ai
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "5001"
    spec:
      terminationGracePeriodSeconds: 90
      containers:
        - name: ai
          image: us-west1-docker.pkg.dev/hammerly-506214/hammerly/hammerly-ai:GIT_SHA
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "5001"
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hammerly-app-secrets
                  key: OPENAI_API_KEY
            - name: HAMMERLY_AI_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hammerly-app-secrets
                  key: HAMMERLY_AI_INTERNAL_TOKEN
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hammerly-app-secrets
                  key: REDIS_PASSWORD
            - name: REDIS_SSL
              value: "false"
            - name: HAMMERLY_REDIS_ENABLED
              value: "true"
            - name: MANAGEMENT_HEALTH_REDIS_ENABLED
              value: "true"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: HAMMERLY_KAFKA_ENABLED
              value: "true"
            - name: SUPABASE_DB_URL
              valueFrom:
                secretKeyRef:
                  name: hammerly-app-secrets
                  key: SUPABASE_DB_URL
            - name: HAMMERLY_RAG_ENABLED
              value: "true"
            - name: HAMMERLY_DB_SSL_MODE
              value: require
            - name: HAMMERLY_AI_EMBEDDING_PROVIDER
              value: openai
            - name: HAMMERLY_AI_EMBEDDING_MODEL
              value: text-embedding-3-small
            - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
              value: health,prometheus
          ports:
            - name: http
              containerPort: 5001
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 48
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
