apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: hammerly
data:
  prometheus.yml: |
    apiVersion: 1
    deleteDatasources:
      - name: Prometheus
        orgId: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
        jsonData:
          httpMethod: POST
          timeInterval: 15s
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: Hammerly
        orgId: 1
        folder: Hammerly
        type: file
        disableDeletion: true
        updateIntervalSeconds: 10
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards
          foldersFromFilesStructure: false
---
# scripts/gcp/deploy-gke-demo.ps1 replaces this bootstrap dashboard from
# observability/grafana/dashboards/hammerly-overview.json without committing a
# second copy of the Phase 6 dashboard.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-app
  namespace: hammerly
data:
  hammerly-overview.json: |
    {"annotations":{"list":[]},"editable":false,"panels":[],"schemaVersion":41,"title":"Hammerly — dashboard sync pending","uid":"hammerly-system-overview","version":1}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-kubernetes
  namespace: hammerly
data:
  hammerly-kubernetes.json: |
    {
      "annotations": {"list": []},
      "editable": false,
      "graphTooltip": 1,
      "panels": [
        {"collapsed":false,"gridPos":{"h":1,"w":24,"x":0,"y":0},"id":1,"panels":[],"title":"Kubernetes / Autoscaling","type":"row"},
        {
          "datasource":{"type":"prometheus","uid":"prometheus"},
          "fieldConfig":{"defaults":{"min":0,"unit":"short"},"overrides":[]},
          "gridPos":{"h":8,"w":8,"x":0,"y":1},"id":2,
          "options":{"legend":{"calcs":["lastNotNull"],"displayMode":"table","placement":"bottom"},"tooltip":{"mode":"multi"}},
          "targets":[
            {"editorMode":"code","expr":"kube_horizontalpodautoscaler_status_current_replicas{namespace=\"hammerly\",horizontalpodautoscaler=\"hammerly-ai\"}","legendFormat":"current","range":true,"refId":"A"},
            {"editorMode":"code","expr":"kube_horizontalpodautoscaler_status_desired_replicas{namespace=\"hammerly\",horizontalpodautoscaler=\"hammerly-ai\"}","legendFormat":"desired","range":true,"refId":"B"},
            {"editorMode":"code","expr":"kube_horizontalpodautoscaler_spec_min_replicas{namespace=\"hammerly\",horizontalpodautoscaler=\"hammerly-ai\"}","legendFormat":"min","range":true,"refId":"C"},
            {"editorMode":"code","expr":"kube_horizontalpodautoscaler_spec_max_replicas{namespace=\"hammerly\",horizontalpodautoscaler=\"hammerly-ai\"}","legendFormat":"max","range":true,"refId":"D"}
          ],"title":"AI Current / Desired Replicas","type":"timeseries"
        },
        {
          "datasource":{"type":"prometheus","uid":"prometheus"},
          "fieldConfig":{"defaults":{"min":0,"unit":"percent"},"overrides":[]},
          "gridPos":{"h":8,"w":8,"x":8,"y":1},"id":3,
          "options":{"legend":{"calcs":["lastNotNull"],"displayMode":"table","placement":"bottom"},"tooltip":{"mode":"multi"}},
          "targets":[
            {"editorMode":"code","expr":"100 * sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"hammerly\",pod=~\"hammerly-ai-.*\",container=\"ai\"}[$__rate_interval])) / clamp_min(sum by (pod) (kube_pod_container_resource_requests{namespace=\"hammerly\",pod=~\"hammerly-ai-.*\",container=\"ai\",resource=\"cpu\"}), 0.001)","legendFormat":"{{pod}}","range":true,"refId":"A"},
            {"editorMode":"code","expr":"vector(60)","legendFormat":"HPA target","range":true,"refId":"B"}
          ],"title":"AI Pod CPU / HPA Target","type":"timeseries"
        },
        {
          "datasource":{"type":"prometheus","uid":"prometheus"},
          "fieldConfig":{"defaults":{"min":0,"unit":"bytes"},"overrides":[]},
          "gridPos":{"h":8,"w":8,"x":16,"y":1},"id":4,
          "options":{"legend":{"calcs":["lastNotNull"],"displayMode":"table","placement":"bottom"},"tooltip":{"mode":"multi"}},
          "targets":[
            {"editorMode":"code","expr":"sum by (pod) (container_memory_working_set_bytes{namespace=\"hammerly\",pod=~\"hammerly-ai-.*\",container=\"ai\"})","legendFormat":"{{pod}}","range":true,"refId":"A"}
          ],"title":"AI Pod Memory","type":"timeseries"
        },
        {
          "datasource":{"type":"prometheus","uid":"prometheus"},
          "fieldConfig":{"defaults":{"min":0,"unit":"reqps"},"overrides":[]},
          "gridPos":{"h":8,"w":6,"x":0,"y":9},"id":5,
          "options":{"legend":{"calcs":["lastNotNull"],"displayMode":"table","placement":"bottom"},"tooltip":{"mode":"multi"}},
          "targets":[{"editorMode":"code","expr":"sum(rate(ai_requests_total[$__rate_interval]))","legendFormat":"requests/s","range":true,"refId":"A"}],
          "title":"AI Request Rate","type":"timeseries"
        },
        {
          "datasource":{"type":"prometheus","uid":"prometheus"},
          "fieldConfig":{"defaults":{"min":0,"unit":"ms"},"overrides":[]},
          "gridPos":{"h":8,"w":6,"x":6,"y":9},"id":6,
          "options":{"legend":{"calcs":["lastNotNull"],"displayMode":"table","placement":"bottom"},"tooltip":{"mode":"multi"}},
          "targets":[
            {"editorMode":"code","expr":"1000 * histogram_quantile(0.50, sum by (le) (rate(ai_request_duration_seconds_bucket[$__rate_interval])))","legendFormat":"P50","range":true,"refId":"A"},
            {"editorMode":"code","expr":"1000 * histogram_quantile(0.95, sum by (le) (rate(ai_request_duration_seconds_bucket[$__rate_interval])))","legendFormat":"P95","range":true,"refId":"B"},
            {"editorMode":"code","expr":"1000 * histogram_quantile(0.99, sum by (le) (rate(ai_request_duration_seconds_bucket[$__rate_interval])))","legendFormat":"P99","range":true,"refId":"C"}
          ],"title":"AI P50 / P95 / P99","type":"timeseries"
        },
        {
          "datasource":{"type":"prometheus","uid":"prometheus"},
          "fieldConfig":{"defaults":{"min":0,"unit":"percent"},"overrides":[]},
          "gridPos":{"h":8,"w":6,"x":12,"y":9},"id":7,
          "options":{"legend":{"calcs":["lastNotNull"],"displayMode":"table","placement":"bottom"},"tooltip":{"mode":"multi"}},
          "targets":[{"editorMode":"code","expr":"100 * (sum(rate(ai_request_duration_seconds_count{outcome=~\"error|cancelled\"}[$__rate_interval])) or vector(0)) / clamp_min(sum(rate(ai_request_duration_seconds_count[$__rate_interval])), 0.000001)","legendFormat":"error rate","range":true,"refId":"A"}],
          "title":"AI Error Rate","type":"timeseries"
        },
        {
          "datasource":{"type":"prometheus","uid":"prometheus"},
          "fieldConfig":{"defaults":{"min":0,"unit":"short"},"overrides":[]},
          "gridPos":{"h":8,"w":6,"x":18,"y":9},"id":8,
          "options":{"legend":{"calcs":["lastNotNull"],"displayMode":"table","placement":"bottom"},"tooltip":{"mode":"multi"}},
          "targets":[
            {"editorMode":"code","expr":"sum by (pod) (increase(kube_pod_container_status_restarts_total{namespace=\"hammerly\"}[$__rate_interval]))","legendFormat":"restarts {{pod}}","range":true,"refId":"A"},
            {"editorMode":"code","expr":"sum by (pod) (kube_pod_status_ready{namespace=\"hammerly\",condition=\"true\"})","legendFormat":"ready {{pod}}","range":true,"refId":"B"}
          ],"title":"Pod Restarts / Readiness","type":"timeseries"
        }
      ],
      "refresh":"5s","schemaVersion":41,"tags":["hammerly","phase8","kubernetes","autoscaling"],
      "templating":{"list":[]},"time":{"from":"now-30m","to":"now"},"timezone":"browser",
      "title":"Hammerly — Kubernetes / Autoscaling","uid":"hammerly-kubernetes-autoscaling","version":1
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: hammerly
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/component: observability
    spec:
      securityContext:
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:13.1.3
          imagePullPolicy: IfNotPresent
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hammerly-app-secrets
                  key: GRAFANA_ADMIN_PASSWORD
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
          ports:
            - name: http
              containerPort: 3000
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: dashboard-providers
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: app-dashboard
              mountPath: /var/lib/grafana/dashboards/hammerly-overview.json
              subPath: hammerly-overview.json
              readOnly: true
            - name: kubernetes-dashboard
              mountPath: /var/lib/grafana/dashboards/hammerly-kubernetes.json
              subPath: hammerly-kubernetes.json
              readOnly: true
            - name: data
              mountPath: /var/lib/grafana
      volumes:
        - name: datasources
          configMap:
            name: grafana-provisioning
            items:
              - key: prometheus.yml
                path: prometheus.yml
        - name: dashboard-providers
          configMap:
            name: grafana-provisioning
            items:
              - key: dashboards.yml
                path: dashboards.yml
        - name: app-dashboard
          configMap:
            name: grafana-dashboard-app
        - name: kubernetes-dashboard
          configMap:
            name: grafana-dashboard-kubernetes
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: hammerly
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: observability
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http

