spring:
  data:
    redis:
      # Production must provide a reachable managed endpoint. The non-routable
      # fallback keeps Redis failures in the existing graceful-degradation path
      # instead of accidentally connecting to the Cloud Run container itself.
      host: ${REDIS_HOST:redis-not-configured.invalid}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
  kafka:
    # Kafka is an optional asynchronous side effect. Production chat remains
    # available while no managed broker/worker runtime has been selected.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka-not-configured.invalid:9092}

hammerly:
  redis:
    enabled: ${HAMMERLY_REDIS_ENABLED:false}
  kafka:
    enabled: ${HAMMERLY_KAFKA_ENABLED:false}

# The application listener is public in the current Cloud Run topology. Keep
# metrics off it by default; a future private collector path must opt in.
management:
  endpoints:
    web:
      exposure:
        include: health
