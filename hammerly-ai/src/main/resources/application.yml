spring:
  application:
    name: hammerly-ai
  threads:
    virtual:
      enabled: true

  config:
    import:
      - optional:file:./secrets/application-local.yml
      - optional:file:./hammerly-ai/secrets/application-local.yml

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:250ms}
      timeout: ${REDIS_COMMAND_TIMEOUT:250ms}
  ai:
    model:
      embedding: none
      image: none
    openai-sdk:
      # Supports OPENAI_API_KEY when no higher-precedence SDK property is present.
      # The fallback keeps older ignored local files using the classic Spring AI
      # namespace compatible with the OpenAI SDK starter used by this service.
      api-key: ${OPENAI_API_KEY:${spring.ai.openai.api-key:}}
      # Resilience4j owns retries. Fine-grained transport timeouts are built in
      # OpenAiTransportConfiguration so long valid streams have no total cap.
      max-retries: 0
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4.1-mini}
          max-completion-tokens: ${OPENAI_MAX_OUTPUT_TOKENS:200}
          store: false
          internal-tool-execution-enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 1
      properties:
        enable.idempotence: true
        max.block.ms: 500
        request.timeout.ms: 1000
        delivery.timeout.ms: 2000

hammerly:
  redis:
    enabled: ${HAMMERLY_REDIS_ENABLED:true}
  kafka:
    enabled: ${HAMMERLY_KAFKA_ENABLED:true}
    events-topic: ${HAMMERLY_KAFKA_AI_EVENTS_TOPIC:hammerly.ai.events.v1}
    jobs-topic: ${HAMMERLY_KAFKA_AI_JOBS_TOPIC:hammerly.ai.jobs.v1}
    summary-after-messages: ${HAMMERLY_AI_SUMMARY_AFTER_MESSAGES:10}
    summary-request-marker-ttl: ${HAMMERLY_AI_SUMMARY_REQUEST_MARKER_TTL:7d}
    broker-ack-timeout: ${HAMMERLY_KAFKA_BROKER_ACK_TIMEOUT:400ms}
  ai:
    internal-token: ${HAMMERLY_AI_INTERNAL_TOKEN:}
    internal-token-required: ${HAMMERLY_AI_INTERNAL_TOKEN_REQUIRED:false}
    system-prompt: classpath:prompts/hammerly-support-system.txt
    stream-max-concurrent: ${HAMMERLY_AI_STREAM_MAX_CONCURRENT:1100}
    stream-timeout: ${HAMMERLY_AI_STREAM_TIMEOUT:5m}
    state:
      conversation:
        max-messages: ${HAMMERLY_AI_CONVERSATION_MAX_MESSAGES:20}
        ttl: ${HAMMERLY_AI_CONVERSATION_TTL:86400}s
      response-cache:
        ttl: ${HAMMERLY_AI_RESPONSE_CACHE_TTL:900}s
      rate-limit:
        requests: ${HAMMERLY_AI_RATE_LIMIT_REQUESTS:20}
        window: ${HAMMERLY_AI_RATE_LIMIT_WINDOW_SECONDS:60}s
    context:
      recent-turns: ${HAMMERLY_AI_CONTEXT_RECENT_TURNS:3}
      max-chars: ${HAMMERLY_AI_CONTEXT_MAX_CHARS:8000}
    rag:
      enabled: ${HAMMERLY_RAG_ENABLED:false}
      top-k: ${HAMMERLY_RAG_TOP_K:3}
      similarity-threshold: ${HAMMERLY_RAG_SIMILARITY_THRESHOLD:0.25}
      cache-ttl: ${HAMMERLY_RAG_CACHE_TTL:5m}
      knowledge-version-cache-ttl: ${HAMMERLY_RAG_KB_VERSION_CACHE_TTL:45s}
      timeout: ${HAMMERLY_RAG_TIMEOUT:1200ms}
      embedding-provider: ${HAMMERLY_AI_EMBEDDING_PROVIDER:deterministic}
      embedding-model: ${HAMMERLY_AI_EMBEDDING_MODEL:text-embedding-3-small}
      embedding-dimension: ${HAMMERLY_RAG_EMBEDDING_DIMENSION:1536}
      openai-base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      openai-api-key: ${OPENAI_API_KEY:}
      datasource-url: ${SUPABASE_DB_URL:}
      datasource-username: ${SUPABASE_DB_USERNAME:}
      datasource-password: ${SUPABASE_DB_PASSWORD:}
      datasource-ssl-mode: ${HAMMERLY_DB_SSL_MODE:require}
    llm:
      connect-timeout: ${HAMMERLY_AI_LLM_CONNECT_TIMEOUT:3s}
      request-timeout: ${HAMMERLY_AI_LLM_REQUEST_TIMEOUT:20s}
      first-token-timeout: ${HAMMERLY_AI_LLM_FIRST_TOKEN_TIMEOUT:8s}
      idle-timeout: ${HAMMERLY_AI_LLM_IDLE_TIMEOUT:10s}
      retry:
        max-attempts: ${HAMMERLY_AI_LLM_MAX_ATTEMPTS:2}
        initial-backoff: ${HAMMERLY_AI_LLM_RETRY_INITIAL_BACKOFF:250ms}
        multiplier: ${HAMMERLY_AI_LLM_RETRY_MULTIPLIER:2.0}
        jitter: ${HAMMERLY_AI_LLM_RETRY_JITTER:0.25}
        max-retry-after: ${HAMMERLY_AI_LLM_MAX_RETRY_AFTER:2s}
      circuit-breaker:
        sliding-window-size: ${HAMMERLY_AI_LLM_CB_WINDOW_SIZE:20}
        minimum-calls: ${HAMMERLY_AI_LLM_CB_MINIMUM_CALLS:10}
        failure-rate-threshold: ${HAMMERLY_AI_LLM_CB_FAILURE_RATE:50}
        slow-call-rate-threshold: ${HAMMERLY_AI_LLM_CB_SLOW_CALL_RATE:80}
        slow-call-duration: ${HAMMERLY_AI_LLM_CB_SLOW_CALL_DURATION:10s}
        open-state-wait: ${HAMMERLY_AI_LLM_CB_OPEN_WAIT:20s}
        half-open-permitted-calls: ${HAMMERLY_AI_LLM_CB_HALF_OPEN_CALLS:3}
      bulkhead:
        max-concurrent-calls: ${HAMMERLY_AI_LLM_MAX_CONCURRENT_CALLS:32}
        max-wait: ${HAMMERLY_AI_LLM_MAX_WAIT:0ms}

server:
  port: ${PORT:5001}
  tomcat:
    connection-timeout: ${HAMMERLY_AI_CONNECTION_TIMEOUT:10s}
    max-connections: ${HAMMERLY_AI_HTTP_MAX_CONNECTIONS:2000}
    accept-count: ${HAMMERLY_AI_HTTP_ACCEPT_COUNT:1000}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  health:
    db:
      enabled: false
    redis:
      enabled: false
  metrics:
    distribution:
      percentiles-histogram:
        ai.request.duration: true
        ai.end.to.end.duration: true
        ai.provider.first.token: true
        ai.provider.full.response: true
        rag.embedding.duration: true
        hammerly.ai.provider.first_token.latency: true
        rag.search.duration: true
