name: hammerly

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - hammerly-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:29092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - hammerly-kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg17
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hammerly}
      POSTGRES_USER: ${POSTGRES_USER:-hammerly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hammerly}
    volumes:
      - hammerly-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  ai:
    image: hammerly-ai:local
    build:
      context: ./hammerly-ai
      dockerfile: Dockerfile
    ports:
      - "${AI_HOST_PORT:-5001}:5001"
    environment:
      PORT: 5001
      SPRING_PROFILES_ACTIVE: ${HAMMERLY_AI_PROFILE:-loadtest}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-200}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_SSL: "false"
      REDIS_CONNECT_TIMEOUT: ${REDIS_CONNECT_TIMEOUT:-250ms}
      REDIS_COMMAND_TIMEOUT: ${REDIS_COMMAND_TIMEOUT:-250ms}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      HAMMERLY_REDIS_ENABLED: ${HAMMERLY_REDIS_ENABLED:-true}
      HAMMERLY_KAFKA_ENABLED: ${HAMMERLY_KAFKA_ENABLED:-true}
      HAMMERLY_RAG_ENABLED: ${HAMMERLY_RAG_ENABLED:-true}
      HAMMERLY_RAG_TOP_K: ${HAMMERLY_RAG_TOP_K:-3}
      HAMMERLY_RAG_SIMILARITY_THRESHOLD: ${HAMMERLY_RAG_SIMILARITY_THRESHOLD:-0.25}
      HAMMERLY_RAG_CACHE_TTL: ${HAMMERLY_RAG_CACHE_TTL:-5m}
      HAMMERLY_RAG_TIMEOUT: ${HAMMERLY_RAG_TIMEOUT:-1200ms}
      HAMMERLY_RAG_KB_VERSION_CACHE_TTL: ${HAMMERLY_RAG_KB_VERSION_CACHE_TTL:-45s}
      HAMMERLY_RAG_EMBEDDING_DIMENSION: ${HAMMERLY_RAG_EMBEDDING_DIMENSION:-1536}
      HAMMERLY_AI_EMBEDDING_PROVIDER: ${HAMMERLY_AI_EMBEDDING_PROVIDER:-deterministic}
      HAMMERLY_AI_EMBEDDING_MODEL: ${HAMMERLY_AI_EMBEDDING_MODEL:-text-embedding-3-small}
      HAMMERLY_AI_CONTEXT_RECENT_TURNS: ${HAMMERLY_AI_CONTEXT_RECENT_TURNS:-3}
      HAMMERLY_AI_CONTEXT_MAX_CHARS: ${HAMMERLY_AI_CONTEXT_MAX_CHARS:-8000}
      HAMMERLY_AI_LLM_MAX_ATTEMPTS: ${HAMMERLY_AI_LLM_MAX_ATTEMPTS:-2}
      HAMMERLY_AI_LLM_FIRST_TOKEN_TIMEOUT: ${HAMMERLY_AI_LLM_FIRST_TOKEN_TIMEOUT:-8s}
      HAMMERLY_AI_LLM_IDLE_TIMEOUT: ${HAMMERLY_AI_LLM_IDLE_TIMEOUT:-10s}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}
      SUPABASE_DB_URL: ${SUPABASE_DB_URL:-jdbc:postgresql://postgres:5432/hammerly}
      SUPABASE_DB_USERNAME: ${SUPABASE_DB_USERNAME:-hammerly}
      SUPABASE_DB_PASSWORD: ${SUPABASE_DB_PASSWORD:-hammerly}
      HAMMERLY_DB_SSL_MODE: ${HAMMERLY_DB_SSL_MODE:-disable}
      HAMMERLY_AI_INTERNAL_TOKEN: ${HAMMERLY_AI_INTERNAL_TOKEN:-}
      MANAGEMENT_HEALTH_REDIS_ENABLED: ${HAMMERLY_REDIS_ENABLED:-true}
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: hammerly-worker:local
    build:
      context: ./hammerly-worker
      dockerfile: Dockerfile
    ports:
      - "${WORKER_HOST_PORT:-5002}:5002"
    environment:
      PORT: 5002
      MANAGEMENT_PORT: 5002
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_SSL: "false"
      REDIS_CONNECT_TIMEOUT: ${REDIS_CONNECT_TIMEOUT:-250ms}
      REDIS_COMMAND_TIMEOUT: ${REDIS_COMMAND_TIMEOUT:-250ms}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      HAMMERLY_KAFKA_AI_EVENTS_TOPIC: hammerly.ai.events.v1
      HAMMERLY_KAFKA_AI_JOBS_TOPIC: hammerly.ai.jobs.v1
      HAMMERLY_WORKER_GROUP_ID: ${HAMMERLY_WORKER_GROUP_ID:-hammerly-worker-v1}
      HAMMERLY_WORKER_CONCURRENCY: ${HAMMERLY_WORKER_CONCURRENCY:-3}
      SUPABASE_DB_URL: ${SUPABASE_DB_URL:-jdbc:postgresql://postgres:5432/hammerly}
      SUPABASE_DB_USERNAME: ${SUPABASE_DB_USERNAME:-hammerly}
      SUPABASE_DB_PASSWORD: ${SUPABASE_DB_PASSWORD:-hammerly}
      HAMMERLY_DB_SSL_MODE: ${HAMMERLY_DB_SSL_MODE:-disable}
      HAMMERLY_AI_EMBEDDING_PROVIDER: ${HAMMERLY_AI_EMBEDDING_PROVIDER:-deterministic}
      HAMMERLY_AI_EMBEDDING_MODEL: ${HAMMERLY_AI_EMBEDDING_MODEL:-text-embedding-3-small}
      HAMMERLY_RAG_CHUNK_TOKENS: ${HAMMERLY_RAG_CHUNK_TOKENS:-650}
      HAMMERLY_RAG_CHUNK_OVERLAP_TOKENS: ${HAMMERLY_RAG_CHUNK_OVERLAP_TOKENS:-100}
      HAMMERLY_RAG_EMBEDDING_DIMENSION: ${HAMMERLY_RAG_EMBEDDING_DIMENSION:-1536}
      HAMMERLY_EMBEDDING_TIMEOUT: ${HAMMERLY_EMBEDDING_TIMEOUT:-20s}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  backend:
    image: hammerly-backend:local
    build:
      context: ./hammerly-backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_HOST_PORT:-5000}:5000"
    environment:
      PORT: 5000
      SUPABASE_DB_URL: ${SUPABASE_DB_URL:-jdbc:postgresql://postgres:5432/hammerly}
      SUPABASE_DB_USERNAME: ${SUPABASE_DB_USERNAME:-hammerly}
      SUPABASE_DB_PASSWORD: ${SUPABASE_DB_PASSWORD:-hammerly}
      HAMMERLY_DB_SSL_MODE: ${HAMMERLY_DB_SSL_MODE:-disable}
      JWT_SECRET: ${JWT_SECRET:-local-compose-jwt-secret-change-me-1234567890}
      HAMMERLY_AUTH_JWT_TTL: ${HAMMERLY_AUTH_JWT_TTL:-45m}
      HAMMERLY_AUTH_RATE_LIMIT_ENABLED: ${HAMMERLY_AUTH_RATE_LIMIT_ENABLED:-true}
      HAMMERLY_AUTH_RATE_LIMIT_REDIS_ENABLED: ${HAMMERLY_AUTH_RATE_LIMIT_REDIS_ENABLED:-true}
      HAMMERLY_AUTH_TRUST_FORWARDED_FOR: ${HAMMERLY_AUTH_TRUST_FORWARDED_FOR:-false}
      HAMMERLY_AUTH_LOGIN_LIMIT: ${HAMMERLY_AUTH_LOGIN_LIMIT:-10}
      HAMMERLY_AUTH_LOGIN_WINDOW: ${HAMMERLY_AUTH_LOGIN_WINDOW:-1m}
      HAMMERLY_AUTH_REGISTER_LIMIT: ${HAMMERLY_AUTH_REGISTER_LIMIT:-5}
      HAMMERLY_AUTH_REGISTER_WINDOW: ${HAMMERLY_AUTH_REGISTER_WINDOW:-10m}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      HAMMERLY_AI_URL: http://ai:5001
      HAMMERLY_AI_INTERNAL_TOKEN: ${HAMMERLY_AI_INTERNAL_TOKEN:-}
      HAMMERLY_INTERNAL_TOKEN_REQUIRED: ${HAMMERLY_INTERNAL_TOKEN_REQUIRED:-false}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_SSL: "false"
      REDIS_CONNECT_TIMEOUT: ${REDIS_CONNECT_TIMEOUT:-250ms}
      REDIS_COMMAND_TIMEOUT: ${REDIS_COMMAND_TIMEOUT:-250ms}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      HAMMERLY_MARKETPLACE_CACHE_ENABLED: ${HAMMERLY_MARKETPLACE_CACHE_ENABLED:-true}
      HAMMERLY_MARKETPLACE_CACHE_OPERATION_TIMEOUT: ${HAMMERLY_MARKETPLACE_CACHE_OPERATION_TIMEOUT:-500ms}
      HAMMERLY_KAFKA_ENABLED: ${HAMMERLY_KAFKA_ENABLED:-true}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.13.2
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - hammerly-prometheus-data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    depends_on:
      backend:
        condition: service_healthy
      ai:
        condition: service_healthy
      worker:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.1.3
    ports:
      - "${GRAFANA_HOST_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - hammerly-grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    depends_on:
      prometheus:
        condition: service_healthy
    restart: unless-stopped

  k6:
    image: hammerly-k6-sse:1.2.2
    build:
      context: .
      dockerfile: load-test/phase5/Dockerfile.k6
    profiles: ["loadtest"]
    working_dir: /workspace
    volumes:
      - ./:/workspace:ro
      - ./load-test/phase5/results:/results
    environment:
      HAMMERLY_LOAD_TEST_BASE_URL: ${HAMMERLY_LOAD_TEST_BASE_URL:-http://backend:5000}
      HAMMERLY_LOAD_TEST_MODE: ${HAMMERLY_LOAD_TEST_MODE:-smoke}
      HAMMERLY_LOAD_TEST_TOKEN: ${HAMMERLY_LOAD_TEST_TOKEN:-}
      PROVIDER_MODE: ${PROVIDER_MODE:-loadtest}
      ALLOW_LIVE_PROVIDER_LOAD_TEST: ${ALLOW_LIVE_PROVIDER_LOAD_TEST:-false}
      PHASE5_SUMMARY_EXPORT: ${PHASE5_SUMMARY_EXPORT:-/results/phase5-summary.json}
      PHASE5_WARMUP_DURATION: ${PHASE5_WARMUP_DURATION:-30s}
      PHASE5_RAMP_DURATION: ${PHASE5_RAMP_DURATION:-15s}
      PHASE5_100_DURATION: ${PHASE5_100_DURATION:-2m}
      PHASE5_500_DURATION: ${PHASE5_500_DURATION:-2m}
      PHASE5_1000_DURATION: ${PHASE5_1000_DURATION:-2m}
      PHASE5_COOLDOWN_DURATION: ${PHASE5_COOLDOWN_DURATION:-30s}
      PHASE5_THINK_TIME: ${PHASE5_THINK_TIME:-10s}
      PHASE5_RUN_ID: ${PHASE5_RUN_ID:-0000}
    depends_on:
      backend:
        condition: service_healthy
    entrypoint: ["k6"]

volumes:
  hammerly-redis-data:
  hammerly-kafka-data:
  hammerly-postgres-data:
  hammerly-prometheus-data:
  hammerly-grafana-data:
